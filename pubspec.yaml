name: vslam
description: "Visual–inertial SLAM with ArUco landmark anchors (mid-evaluation build: sensor acquisition and recording UI)."
publish_to: 'none'
version: 0.5.0+1

environment:
  sdk: ^3.13.7

dependencies:
  archive: ^4.6.0
  dartcv4: ^2.3.1
  flutter:
    sdk: flutter
  path_provider: ^2.1.6
  provider: ^6.1.5+1
  sensors_plus: ^7.1.1
  share_plus: ^13.3.1
  vector_math: ^2.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

# OpenCV modules (dartcv4 README, "hooks: user_defines"): calib3d for
# calibration (WP2); objdetect and aruco for marker detection (WP3), enabled
# now so OpenCV is compiled once. The list replaces dartcv4's default set
# (hook_helpers/user_defines.dart), so imgproc and imgcodecs must be listed.
hooks:
  user_defines:
    dartcv4:
      include_modules:
        - imgproc
        - imgcodecs
        - calib3d
        - features2d
        - flann
        - objdetect
        - aruco
